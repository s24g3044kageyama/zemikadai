<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="nyCrust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nyCheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="nyBrownTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="80%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="nyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#nyBg)" rx="16"/>

  <!-- Plate -->
  <ellipse cx="200" cy="240" rx="140" ry="24" fill="#e2e8f0" opacity="0.8"/>
  <ellipse cx="200" cy="236" rx="130" ry="20" fill="#ffffff" filter="url(#nyShadow)"/>

  <!-- Cheesecake Wedge Slice (Isometric 3D) -->
  <!-- Crust Bottom -->
  <path d="M120 200 L260 215 L280 200 L160 188 Z" fill="url(#nyCrust)"/>
  <!-- Front Cheesecake Cross-section -->
  <path d="M120 160 L260 175 L260 215 L120 200 Z" fill="url(#nyCheese)"/>
  <!-- Cheese texture speckles -->
  <circle cx="150" cy="180" r="1.5" fill="#fde047"/>
  <circle cx="210" cy="190" r="1.5" fill="#fde047"/>
  <circle cx="240" cy="185" r="1" fill="#fde047"/>

  <!-- Side Cross-section -->
  <path d="M260 175 L280 160 L280 200 L260 215 Z" fill="#fef08a"/>

  <!-- Baked Golden-Brown Top Surface -->
  <path d="M120 160 L240 135 L280 160 L260 175 Z" fill="url(#nyBrownTop)" filter="url(#nyShadow)"/>

  <!-- Roasted Burn Marks / Caramelized swirls -->
  <ellipse cx="210" cy="155" rx="35" ry="12" fill="#78350f" opacity="0.4" transform="rotate(-10 210 155)"/>
  <ellipse cx="230" cy="148" rx="20" ry="8" fill="#451a03" opacity="0.4" transform="rotate(-15 230 148)"/>

  <!-- Back Crust Edge -->
  <path d="M240 135 L280 160" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>

  <!-- Side Berry Coulis Swirl on Plate -->
  <path d="M100 230 C130 245, 170 240, 200 245" stroke="#be123c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="95" cy="229" r="4" fill="#be123c"/>
  <circle cx="210" cy="245" r="3" fill="#be123c"/>

  <!-- Fresh Lemon Twist and Mint -->
  <path d="M140 150 Q155 140, 160 155 Q145 155, 140 150 Z" fill="#fde047"/>
  <path d="M155 145 Q165 135, 168 145" stroke="#16a34a" stroke-width="3" fill="none"/>
</svg>
