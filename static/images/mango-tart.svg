<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mtBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="custardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="mangoSlice1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="mtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#mtBg)" rx="16"/>

  <!-- Plate -->
  <ellipse cx="200" cy="240" rx="140" ry="24" fill="#e2e8f0" opacity="0.8"/>
  <ellipse cx="200" cy="236" rx="130" ry="20" fill="#ffffff" filter="url(#mtShadow)"/>

  <!-- Tart Crust -->
  <path d="M120 190 Q200 200, 280 190 L270 218 Q200 230, 130 218 Z" fill="url(#crustGrad)" filter="url(#mtShadow)"/>
  <!-- Crust Edge Scallops -->
  <path d="M120 190 Q130 185, 140 190 Q150 185, 160 190 Q170 185, 180 190 Q190 185, 200 190 Q210 185, 220 190 Q230 185, 240 190 Q250 185, 260 190 Q270 185, 280 190" stroke="#78350f" stroke-width="3" fill="none"/>

  <!-- Custard / Frangipane Bed -->
  <ellipse cx="200" cy="185" rx="72" ry="16" fill="url(#custardGrad)"/>

  <!-- Arranged Mango Slices (Rose Pattern) -->
  <!-- Outer Ring -->
  <ellipse cx="150" cy="180" rx="28" ry="12" fill="url(#mangoSlice1)" transform="rotate(-25 150 180)"/>
  <ellipse cx="250" cy="180" rx="28" ry="12" fill="url(#mangoSlice1)" transform="rotate(25 250 180)"/>
  <ellipse cx="170" cy="190" rx="26" ry="11" fill="url(#mangoSlice1)" transform="rotate(-10 170 190)"/>
  <ellipse cx="230" cy="190" rx="26" ry="11" fill="url(#mangoSlice1)" transform="rotate(10 230 190)"/>
  <ellipse cx="200" cy="195" rx="28" ry="12" fill="url(#mangoSlice1)"/>

  <!-- Inner Ring / Rose Crown -->
  <ellipse cx="175" cy="168" rx="22" ry="10" fill="url(#mangoSlice1)" transform="rotate(-35 175 168)"/>
  <ellipse cx="225" cy="168" rx="22" ry="10" fill="url(#mangoSlice1)" transform="rotate(35 225 168)"/>
  <ellipse cx="190" cy="160" rx="20" ry="9" fill="url(#mangoSlice1)" transform="rotate(-15 190 160)"/>
  <ellipse cx="210" cy="160" rx="20" ry="9" fill="url(#mangoSlice1)" transform="rotate(15 210 160)"/>
  <ellipse cx="200" cy="150" rx="15" ry="8" fill="url(#mangoSlice1)"/>

  <!-- Blueberries & Raspberries Accent -->
  <circle cx="160" cy="165" r="7" fill="#1e1b4b" filter="url(#mtShadow)"/>
  <circle cx="160" cy="164" r="2.5" fill="#c7d2fe"/>
  <circle cx="240" cy="168" r="7.5" fill="#be123c" filter="url(#mtShadow)"/>

  <!-- Fresh Mint Leaf -->
  <path d="M200 135 C190 120, 215 110, 215 130 Z" fill="#15803d"/>
  <path d="M210 137 C225 125, 235 135, 215 140 Z" fill="#22c55e"/>

  <!-- Nappage Glaze Highlights -->
  <ellipse cx="180" cy="175" rx="10" ry="3" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="220" cy="170" rx="8" ry="2.5" fill="#ffffff" opacity="0.5"/>
</svg>
