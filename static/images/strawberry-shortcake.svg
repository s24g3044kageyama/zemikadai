<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7d7"/>
    </linearGradient>
    <linearGradient id="spongeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="strawberryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="16"/>

  <!-- Plate -->
  <ellipse cx="200" cy="240" rx="140" ry="24" fill="#e2e8f0" opacity="0.8"/>
  <ellipse cx="200" cy="236" rx="130" ry="20" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Cake Base Shadow -->
  <path d="M120 220 C160 235, 240 235, 280 220 C280 210, 120 210, 120 220 Z" fill="#cbd5e1" opacity="0.5"/>

  <!-- Cake Slice Body -->
  <!-- Bottom Sponge -->
  <path d="M120 185 L280 185 L280 215 C240 228, 160 228, 120 215 Z" fill="url(#spongeGrad)"/>
  <!-- Middle Cream Layer with Strawberries -->
  <path d="M120 165 L280 165 L280 185 L120 185 Z" fill="url(#creamGrad)"/>
  <circle cx="160" cy="175" r="7" fill="url(#strawberryGrad)"/>
  <circle cx="200" cy="175" r="7" fill="url(#strawberryGrad)"/>
  <circle cx="240" cy="175" r="7" fill="url(#strawberryGrad)"/>
  <!-- Upper Sponge -->
  <path d="M120 135 L280 135 L280 165 L120 165 Z" fill="url(#spongeGrad)"/>
  <!-- Top Cream Frosting -->
  <path d="M120 120 Q160 125, 200 120 Q240 125, 280 120 L280 138 C240 142, 160 142, 120 138 Z" fill="url(#creamGrad)" filter="url(#shadow)"/>

  <!-- Whipped Cream Dollops on Top -->
  <path d="M140 115 C130 95, 160 95, 150 115 Z" fill="#ffffff"/>
  <path d="M200 112 C185 85, 215 85, 200 112 Z" fill="#ffffff"/>
  <path d="M260 115 C250 95, 280 95, 270 115 Z" fill="#ffffff"/>

  <!-- Big Red Strawberry Center -->
  <g transform="translate(200, 85)">
    <path d="M0 -30 C-22 -15, -20 15, 0 25 C20 15, 22 -15, 0 -30 Z" fill="url(#strawberryGrad)" filter="url(#shadow)"/>
    <!-- Strawberry Seeds -->
    <ellipse cx="-8" cy="-5" rx="1.5" ry="2.5" fill="#fef08a" transform="rotate(-15)"/>
    <ellipse cx="6" cy="-8" rx="1.5" ry="2.5" fill="#fef08a" transform="rotate(15)"/>
    <ellipse cx="-4" cy="10" rx="1.5" ry="2.5" fill="#fef08a"/>
    <ellipse cx="7" cy="8" rx="1.5" ry="2.5" fill="#fef08a" transform="rotate(10)"/>
    <!-- Strawberry Leaves -->
    <path d="M0 -30 C-10 -40, -18 -32, -6 -28 C-2 -42, 8 -42, 6 -28 C18 -32, 12 -42, 0 -30 Z" fill="#22c55e"/>
  </g>

  <!-- Side Strawberry Slice -->
  <g transform="translate(145, 105) scale(0.65) rotate(-15)">
    <path d="M0 -30 C-20 -15, -18 15, 0 25 C18 15, 20 -15, 0 -30 Z" fill="url(#strawberryGrad)"/>
    <path d="M0 -25 C-5 -35, -12 -28, -4 -24 C-1 -36, 6 -36, 4 -24 C12 -28, 8 -36, 0 -25 Z" fill="#22c55e"/>
  </g>

  <!-- Mint Leaf -->
  <path d="M225 75 Q245 65, 250 80 Q235 85, 225 75 Z" fill="#16a34a"/>
</svg>
